name: Build suzop APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:   # можно запустить вручную кнопкой

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. Забрать код из репозитория
      - uses: actions/checkout@v4

      # 2. Установить Flutter
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 3. Сгенерировать недостающую Android-обвязку (gradle-файлы и т.д.),
      #    не трогая наш lib/, pubspec.yaml и android/ файлы
      - name: Bootstrap project
        run: |
          flutter create . --org ai.suzop --project-name suzop --platforms android

      # 4. Фирменная иконка SUZOP: скачиваем PNG и ставим его вместо
      #    стандартной иконки Flutter во все плотности экрана.
      #    Удаляем adaptive-XML, иначе Android берёт стандартную заглушку.
      #    Если картинка недоступна — сборка продолжается со стандартной.
      - name: SUZOP launcher icon
        run: |
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          if curl -fsSL -o /tmp/icon.png "https://d2lm3begjhzc49.cloudfront.net/file-interaction/7988fcb4-ic_launcher_suzop.png"; then
            for d in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
              cp /tmp/icon.png "android/app/src/main/res/$d/ic_launcher.png"
            done
          fi

      # 5. Зависимости
      - name: Pub get
        run: flutter pub get

      # 6. Сборка release-APK
      - name: Build APK
        run: flutter build apk --release

      # 7. Выложить готовый APK как артефакт для скачивания
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: suzop-apk
          path: build/app/outputs/flutter-apk/app-release.apk
